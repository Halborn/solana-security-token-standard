[package]
name = "ssts-org-client"
version = "0.3.0"
description = "Rust client for the Solana Security Token"
authors = ["SSTS Foundation"]
repository = "https://github.com/Solana-Security-Token-Standard/solana-security-token-standard"
license = "Apache-2.0"
edition = "2021"
readme = "README.md"
documentation = "https://docs.rs/ssts-org-client"

[lib]
name = "security_token_client"

[features]
default = []
serde = ["dep:serde", "dep:serde_with"]
fetch = ["dep:solana-client", "dep:solana-account"]
# anchor = ["dep:anchor-lang"]
# anchor-idl-build = ["anchor"]

[dependencies.serde]
version = "1.0"
optional = true
features = ["derive"]

[dependencies]
borsh = { workspace = true }
solana-pubkey = { version = "2.4.0", features = ["borsh"] }
solana-instruction = "2.3.0"
solana-account-info = "2.3.0"
solana-account = { version = "2.2.1", optional = true }
solana-program-error = "2.2.2"
solana-cpi = "2.2.1"
solana-client = { version = "2.3.1", optional = true }
num-derive = "0.4.2"
num-traits = "0.2.19"
thiserror = { workspace = true }
serde_with = { version = "3.14.0", optional = true }


# anchor-lang = { version = "0.30.1", optional = true }
