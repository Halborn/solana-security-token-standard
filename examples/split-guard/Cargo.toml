[package]
name = "split-guard"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Split Guard verification program — blocks transfers during Split operations"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
no-entrypoint = []

[dependencies]
pinocchio = { workspace = true }
pinocchio-log = { workspace = true }
pinocchio-pubkey = { workspace = true }
pinocchio-system = { workspace = true }

[dev-dependencies]
security-token-client = { package = "ssts-org-client", path = "../../clients/rust" }
security-token-program = { path = "../../program", features = ["no-entrypoint"] }
security-token-transfer-hook = { path = "../../transfer_hook", features = ["no-entrypoint"] }
solana-program = "2.3.0"
solana-program-test = "2.3.1"
solana-pubkey = "2.4.0"
solana-sdk = "2.3.1"
spl-associated-token-account = { version = "7.0.0", features = ["no-entrypoint"] }
spl-token-2022 = { version = "9.0.0", features = ["no-entrypoint"] }
spl-transfer-hook-interface = "0.9.0"
tokio = { version = "1", features = ["full"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
] }
